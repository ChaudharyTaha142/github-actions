# This will deploy the safe / secure / tested app to Prod server

name: Deploy To Server

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: SSH to Prod Server && Create app folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            echo "Starting Deployment"
            mkdir -p ~/devops

      - name: Copy the docker-compose file from the repo to the server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "~/devops"

      - name: SSH to Prod Server && Run the app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            echo "Running App"

            sudo apt-get update -y
            sudo apt-get install docker.io docker-compose-v2 -y

            sudo systemctl enable docker
            sudo systemctl start docker

            echo "DOCKERHUB_USER=${{ vars.DOCKERHUB_USER }}" > ~/devops/.env

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ vars.DOCKERHUB_USER }}" --password-stdin

            cd ~/devops
            sudo docker compose --env-file .env up -d --force-recreate
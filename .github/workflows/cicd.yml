# This is the name of the workflow that will be displayed in the Actions tab
name: CICD

on:
  workflow_dispatch:
   inputs:
     environment:
        
        description:  This is the environment where this workflow run 
        default: 'dev'
        required: true
        type: choice
        options:
          - dev
          - prod
          - staging

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Code cloned from GitHub
        run: echo "Code cloned from GitHub"

  build:
    runs-on: ubuntu-latest
    needs: code

    steps:
      - name: Build Docker container
        run: echo "Docker container built"

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Test the container
        run: echo "Testing the container"

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy the app
        run: echo "Docker Compose deployed the app"

# This is workflow name
name: Hello Workflow

# Runs on a trigger
on:
  workflow_dispatch:

# These are jobs inside the workflow
jobs:
  # This is the name of the job
  greet:
    # This is GitHub Runner
    runs-on: ubuntu-latest

    steps:
      - name: Say hello to user
        run: echo "Hello Taha"

      - name: Say hello to username
        run: echo "Hello $USER"

  details:
    runs-on: ubuntu-latest

    steps:
      - name: Show versions of Docker and Python
        run: |
          docker --version
          python --version
